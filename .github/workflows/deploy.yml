name: Deploy to Render

# Render redeploys automatically on every push to main via its native GitHub
# integration (see render.yaml). This workflow is an optional explicit trigger,
# useful mainly for manual re-deploys or to gate deploys on CI success.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Call Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping explicit trigger (Render's native auto-deploy will handle it)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

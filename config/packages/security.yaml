security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        # Bcrypt hash of the admin password, generated with:
                        #   php bin/console security:hash-password
                        # Override ADMIN_PASSWORD_HASH in production with a hash of a strong,
                        # secret password (never commit the production value).
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: app_login
                check_path: app_login
            logout:
                path: app_logout
                target: spot_index

    access_control:
        - { path: ^/spots/(new|edit|delete|import|export), roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

